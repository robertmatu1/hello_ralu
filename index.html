<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17151c">
<title>R + R | Sunday Club</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff4f7;background:#17151c}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:18px}button{font:inherit;cursor:pointer}main{width:min(100%,440px);background:#201b23;border:1px solid #493643;border-radius:26px;padding:22px;box-shadow:0 20px 70px #0006}.top{display:flex;justify-content:space-between;color:#e8c7d6;font-size:12px;font-weight:700;letter-spacing:.11em;margin-bottom:22px}.heart{color:#f49ab8}.hero{height:190px;border-radius:18px;background:radial-gradient(circle at 25% 35%,#bd6d79 0 8%,transparent 9%),radial-gradient(circle at 70% 40%,#f6c1a2 0 6%,transparent 7%),linear-gradient(135deg,#513143,#9b6d6c 55%,#49394b);display:grid;place-items:center;font-size:64px}.center{text-align:center}.eyebrow{font-size:11px;letter-spacing:.15em;color:#f19ab6;font-weight:700}.sub{color:#c9bbc7;line-height:1.6}h1{font-size:30px;letter-spacing:-.045em;margin:14px 0 8px}h2{font-size:22px;margin:6px 0 10px}.pink{color:#f5b1c8}.primary{border:0;background:#f19ab6;color:#291922;border-radius:100px;width:100%;padding:15px;font-weight:750;margin-top:22px}.primary:hover{background:#ffc0d4}.ghost{border:0;background:transparent;color:#d2c0cc;padding:14px}.option{width:100%;background:#302731;color:#fff4f7;border:1px solid #4c3a49;border-radius:16px;text-align:left;display:flex;align-items:center;gap:14px;padding:16px;margin:11px 0;transition:transform .15s,border-color .15s}.option:hover,.option:focus-visible{transform:translateY(-2px);border-color:#f19ab6}.emoji{font-size:30px;background:#44303f;border-radius:12px;width:56px;height:56px;display:grid;place-items:center;flex-shrink:0}.option strong{display:block;margin-bottom:5px}.option small{display:block;color:#c7b8c4;line-height:1.45}.arrow{margin-left:auto;color:#f19ab6}.panel{background:#302731;border-radius:16px;padding:18px;margin-top:18px}.panel label{display:block;padding:9px 0;color:#e7dce3}.panel input{accent-color:#f19ab6;margin-right:9px}.section-label{font-size:12px;color:#d2b9c9;font-weight:700;margin:14px 0 5px}.hidden{display:none}.note{margin-top:16px;color:#f4b3c9;font-style:italic;line-height:1.6}.footer{border-top:1px solid #493643;padding-top:16px;margin-top:20px;text-align:center;color:#a997a4;font-size:11px}.actions{text-align:center}.summary{background:#302731;border-radius:16px;padding:18px;margin:22px 0;text-align:left}.summary small{color:#c6b2c1;letter-spacing:.12em}.summary p{color:#d7c8d3}.success{font-size:52px;color:#f19ab6}.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.fade,.option{animation:none;transition:none}}
</style>
</head>
<body><main><div class="top"><span>R + R / SUNDAY CLUB</span><span class="heart">♡</span></div><div id="app" aria-live="polite"></div><div class="footer">Made with a little effort and questionable design skills ♡</div></main>
<script>
const plans=[{emoji:'🍰',title:'A little throwback',desc:'Cofetarie, ceva dulce si povesti. Sounds familiar?',detail:'Something sweet, a familiar place and no rush.'},{emoji:'☕',title:'Sunday, no rush',desc:'Cafea, ceva bun si o plimbare fara planuri.',detail:'Coffee, good food and seeing where the day takes us.'},{emoji:'🎃',title:'Spooky & cozy',desc:'Halloween movie, popcorn si o patura.',detail:"You pick the movie. I'll bring the snacks."},{emoji:'🎲',title:"Dealer's choice",desc:'Iti pregatesc eu o surpriza. Trust me? :))',detail:"You just show up. I'll figure out the rest."}];
let page=0,chosen=-1,movie='Hocus Pocus',snack='Popcorn',revealed=false;const app=document.getElementById('app');
function render(){let p=plans[chosen];if(page===0)app.innerHTML=`<section class="fade center"><div class="hero" aria-hidden="true">☕ 🥐</div><h1>Hey, Ralu :)</h1><h2 class="pink">I have a very important question.</h2><p class="sub">What are we doing tomorrow?</p><button class="primary" id="start">Let's find out →</button><p class="sub" style="font-size:12px">Takes approximately 15 seconds. Very scientific.</p></section>`;
if(page===1)app.innerHTML=`<section class="fade"><div class="center"><p class="eyebrow">THE BIG DECISION</p><h1>Pick your Sunday</h1><p class="sub">Four options. Zero wrong answers.</p></div>${plans.map((x,i)=>`<button class="option" data-pick="${i}"><span class="emoji">${x.emoji}</span><span><strong>${x.title}</strong><small>${x.desc}</small></span><span class="arrow">↗</span></button>`).join('')}<div class="actions"><button class="ghost" id="back">← Back</button></div></section>`;
if(page===2)app.innerHTML=`<section class="fade center"><div style="font-size:50px">${p.emoji}</div><h1>It's a date!</h1><h2 class="pink">${p.title}</h2><p class="sub">${p.detail}</p>${chosen===2?`<div class="panel" style="text-align:left"><strong>Movie night essentials</strong><div class="section-label">Your movie pick</div>${['Hocus Pocus','Corpse Bride','The Addams Family','Surprise me'].map(x=>`<label><input type="radio" name="movie" value="${x}" ${movie===x?'checked':''}>${x}</label>`).join('')}<div class="section-label">Mandatory snack</div>${['Popcorn','Something sweet','Both, obviously'].map(x=>`<label><input type="radio" name="snack" value="${x}" ${snack===x?'checked':''}>${x}</label>`).join('')}</div>`:''}<button class="primary" id="confirm">Confirm our date ✓</button><button class="ghost" id="back">Actually, let me reconsider :))</button></section>`;
if(page===3)app.innerHTML=`<section class="fade center"><div class="success">✓</div><h1>Sunday = sorted.</h1><p class="sub">One less decision to make tomorrow.</p><div class="summary"><small>OUR PLAN ${p.emoji}</small><h2>${p.title}</h2><p>${chosen===2?'🎬 '+movie+'<br>🍿 '+snack:p.desc}</p></div><button class="primary" id="copy">Copy our plan</button><button class="ghost" id="bonus">${revealed?'Hide tiny bonus message':'🎁 Tiny bonus message'}</button>${revealed?'<p class="note">P.S. I was looking forward to seeing you anyway :)</p>':''}<button class="ghost" id="restart">Start over</button></section>`;
app.querySelector('#start')?.addEventListener('click',()=>{page=1;render()});app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{chosen=Number(b.dataset.pick);page=2;render()}));app.querySelector('#back')?.addEventListener('click',()=>{page=page===2?1:0;render()});app.querySelectorAll('input[name=movie]').forEach(i=>i.addEventListener('change',()=>movie=i.value));app.querySelectorAll('input[name=snack]').forEach(i=>i.addEventListener('change',()=>snack=i.value));app.querySelector('#confirm')?.addEventListener('click',()=>{page=3;render()});app.querySelector('#bonus')?.addEventListener('click',()=>{revealed=!revealed;render()});app.querySelector('#restart')?.addEventListener('click',()=>{page=0;chosen=-1;movie='Hocus Pocus';snack='Popcorn';revealed=false;render()});app.querySelector('#copy')?.addEventListener('click',async()=>{const text='Sunday plan: '+p.title+(chosen===2?' | Movie: '+movie+' | Snacks: '+snack:'')+' 💕';try{await navigator.clipboard.writeText(text);app.querySelector('#copy').textContent='Copied ✓'}catch{window.prompt('Copy our plan:',text)}})}render();
</script></body></html>
